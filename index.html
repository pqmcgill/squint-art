<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squint Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="https://github.com/pqmcgill/squint-art" class="github-corner" aria-label="View source on GitHub">
    <svg width="80" height="80" viewBox="0 0 250 250" aria-hidden="true">
      <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z" fill="#7c6aef"/>
      <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="#fff" style="transform-origin: 130px 106px;" class="octo-arm"/>
      <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="#fff"/>
    </svg>
  </a>

  <div id="app">
    <header>
      <h1>Squint Art</h1>
      <p class="subtitle">Evolving images and GIFs with genetic algorithms &amp; polygons</p>
    </header>

    <input type="file" id="file-input" accept="image/*,image/gif" hidden>
    <div id="drop-zone" class="drop-zone">
      <div class="drop-zone-content">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>Drop an image or GIF here</p>
        <p class="hint">or tap to select</p>
      </div>
    </div>

    <div id="workspace" class="workspace hidden">
      <!-- Output first (more interesting on mobile), reference second -->
      <div class="canvases">
        <div class="canvas-container output-container">
          <h3 id="best-label">Best Individual</h3>
          <div class="canvas-wrapper">
            <canvas id="output-canvas"></canvas>
            <button id="canvas-play-btn" class="canvas-play-btn" aria-label="Start">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="canvas-container ref-container">
          <h3>Reference</h3>
          <canvas id="reference-canvas"></canvas>
        </div>
      </div>

      <!-- Stats: generation + similarity always visible; gen/s + islands are power-user -->
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Generation</span>
          <strong id="gen-count">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Similarity</span>
          <strong id="similarity-value">&mdash;</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Gen/s</span>
          <strong id="gens-per-sec">&mdash;</strong>
        </div>
        <div class="stat stat-detail" title="Independent populations evolving in parallel across your CPU cores. They periodically share their best individuals to combine diversity with speed.">
          <span class="stat-label">Islands</span>
          <strong id="islands-value">&mdash;</strong>
        </div>
      </div>

      <!-- Controls: sticky on mobile. Progress replaces buttons during GIF processing. -->
      <div class="controls" id="controls">
        <div id="controls-buttons">
          <button id="start-btn" class="btn btn-primary">Start</button>
          <button id="stop-btn" class="btn" disabled>Stop</button>
          <button id="reset-btn" class="btn">Reset</button>
          <button id="download-btn" class="btn" disabled>Download</button>
          <button id="new-image-btn" class="btn">New Image</button>
        </div>
        <div id="gif-progress" class="gif-progress hidden">
          <div class="gif-progress-top">
            <strong id="gif-progress-frame">0 / 0</strong>
            <span class="gif-progress-meta">
              <span id="gif-progress-eta"></span>
              <button id="gif-cancel-btn" class="btn btn-sm">Cancel</button>
            </span>
          </div>
          <div class="gif-progress-bar">
            <div id="gif-progress-fill" class="gif-progress-fill">
              <span id="gif-progress-pct"></span>
            </div>
          </div>
        </div>
      </div>

      <details class="settings">
        <summary>Settings</summary>
        <div class="settings-grid">
          <label title="Color the canvas is filled with before drawing polygons. Polygons evolve to paint on top of this color, so picking one close to the image background lets polygons focus on detail instead of repainting the background.">
            Background Color
            <input type="color" id="bg-color" value="#000000">
          </label>
          <label title="Automatically pick the background color from the reference image's edges when an image loads.">
            Auto-detect background
            <select id="bg-auto">
              <option value="1" selected>On</option>
              <option value="0">Off</option>
            </select>
          </label>
          <label>
            Population Size
            <input type="number" id="pop-size" value="50" min="10" max="500">
          </label>
          <label title="Shape primitive used to approximate the image.">
            Shape
            <select id="shape">
              <option value="polygon">Polygon</option>
              <option value="circle">Circle</option>
              <option value="ellipse">Ellipse</option>
              <option value="rectangle">Rectangle</option>
              <option value="line">Line</option>
            </select>
          </label>
          <label>
            Shapes per Individual
            <input type="number" id="num-polygons" value="50" min="5" max="300">
          </label>
          <label id="num-vertices-label">
            Vertices per Polygon
            <input type="number" id="num-vertices" value="6" min="3" max="10">
          </label>
          <label title="Per-gene probability of mutation. Higher = more exploration, lower = fine-tuning. Adapts automatically during the run.">
            Mutation Rate
            <input type="number" id="mutation-rate" value="0.03" min="0.001" max="0.5" step="0.001">
          </label>
          <label title="How many random candidates compete for parent selection. Higher = greedier, converges faster but less diversity.">
            Tournament Size
            <input type="number" id="tournament-size" value="5" min="2" max="20">
          </label>
          <label title="Resolution for the reference image and display. Higher captures more detail but runs slower.">
            Work Resolution (px)
            <input type="number" id="work-res" value="128" min="32" max="512" step="16">
          </label>
          <label title="Fitness evaluation runs at this fraction of the work resolution. 2 = half size per axis (4x faster). No quality loss.">
            Fitness Downscale (1 = full)
            <input type="number" id="fit-div" value="2" min="1" max="8" step="1">
          </label>
          <label title="Compare every Nth pixel during fitness evaluation. Minimal impact since rendering dominates.">
            Subsample (1 = all pixels)
            <input type="number" id="sub-sample" value="1" min="1" max="16" step="1">
          </label>
          <label title="How islands exchange genetic material. Ring: 2 neighbors, slow diffusion, more diversity. Star: all connected, fast spread. Grid: 2D neighborhood.">
            Migration Topology
            <select id="topology">
              <option value="ring" selected>Ring</option>
              <option value="grid">Grid</option>
              <option value="star">Star</option>
            </select>
          </label>
          <label title="How many GA generations to run per GIF frame. More = better quality per frame, slower overall.">
            GIF: Generations/Frame
            <input type="number" id="gif-gens" value="500" min="50" max="10000" step="50">
          </label>
          <label title="Seed each frame's population from the previous frame's best. Gives temporal coherence so frames don't flicker.">
            GIF: Warm Start
            <select id="gif-warm">
              <option value="1" selected>On</option>
              <option value="0">Off</option>
            </select>
          </label>
        </div>
      </details>

      <!-- GIF confirmation modal -->
      <div id="gif-modal" class="modal hidden">
        <div class="modal-content">
          <h3>GIF Detected</h3>
          <p id="gif-modal-info"></p>
          <div class="modal-actions">
            <button id="gif-confirm" class="btn btn-primary">Process</button>
            <button id="gif-cancel" class="btn">Cancel</button>
          </div>
        </div>
      </div>

      <!-- Download resolution modal -->
      <div id="download-modal" class="modal hidden">
        <div class="modal-content">
          <h3>Download</h3>
          <p>Re-renders the art at the selected resolution.</p>
          <div class="download-resolutions">
            <label class="dl-option">
              <input type="radio" name="dl-res" value="original" checked>
              <span>Original</span>
              <span class="dl-dims" data-preset="original"></span>
            </label>
            <label class="dl-option">
              <input type="radio" name="dl-res" value="1080p">
              <span>HD 1080p</span>
              <span class="dl-dims" data-preset="1080p"></span>
            </label>
            <label class="dl-option">
              <input type="radio" name="dl-res" value="1440p">
              <span>QHD 1440p</span>
              <span class="dl-dims" data-preset="1440p"></span>
            </label>
            <label class="dl-option">
              <input type="radio" name="dl-res" value="4k">
              <span>4K UHD</span>
              <span class="dl-dims" data-preset="4k"></span>
            </label>
            <label class="dl-option">
              <input type="radio" name="dl-res" value="custom">
              <span>Custom</span>
              <span class="dl-custom-inputs">
                <input type="number" id="dl-custom-w" min="1" max="7680" placeholder="Width" disabled>
                <span>&times;</span>
                <input type="number" id="dl-custom-h" disabled placeholder="Height">
              </span>
            </label>
          </div>
          <div class="modal-actions">
            <button id="dl-confirm" class="btn btn-primary">Download</button>
            <button id="dl-cancel" class="btn">Cancel</button>
          </div>
        </div>
      </div>


      <!-- Performance charts: collapsed by default, skip rendering when closed -->
      <details class="monitor-panel" id="monitor-panel" title="Similarity over time and island migration visualization. Collapsed to save CPU cycles.">
        <summary>Performance</summary>
        <div class="monitor-row">
          <div class="chart-section">
            <div class="chart-header">
              <div class="chart-actions">
                <div class="axis-toggle">
                  <button class="toggle-btn active" data-axis="generation">Generation</button>
                  <button class="toggle-btn" data-axis="time">Time</button>
                </div>
                <button class="btn btn-sm" id="export-btn">Export JSON</button>
                <button class="btn btn-sm" id="clear-chart-btn">Clear</button>
              </div>
            </div>
            <canvas id="chart-canvas"></canvas>
          </div>
          <div class="viz-section">
            <div class="chart-header">
              <h3>Islands</h3>
            </div>
            <canvas id="migration-canvas"></canvas>
          </div>
        </div>
      </details>
    </div>
  </div>

  <script src="dist/app.js"></script>
</body>
</html>
