name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: npm install

      - run: npm run build

      - run: npm run lint

      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: npm install

      - run: npm run build

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html style.css _site/
          cp -r dist _site/dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4

      - id: deployment
        uses: actions/deploy-pages@v5
